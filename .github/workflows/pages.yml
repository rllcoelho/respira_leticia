name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Obter código
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Gerar páginas locais
        run: npm run build
      - name: Verificar sintaxe
        run: npm run check
      - name: Executar testes
        run: npm test
      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Gerar pacote de publicação
        run: npm run build:pages
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Enviar pacote
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
